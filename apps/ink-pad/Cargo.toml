[package]
name = "ink-pad"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Quarter-screen raw-evdev handwriting pad for Kindle Scribe"

[dependencies]
ink-inference = { path = "../../ink-rs" }
serde_json = "1"
fontdue = "0.9"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
